project:
  name: airs-ai-gateway-docker
  version: "0.1.0"
  product_goal: >
    One-command Docker Compose installer for the Prisma AIRS AI Gateway hybrid data plane
    (gateway + Redis), driven by the values.yaml issued by Strata Cloud Manager. The shipped
    surface (FR1-FR9) is documented in docs/PRD.md. This file tracks only planned / open work.

conventions:
  statuses: [todo, in_progress, blocked, done]
  priorities: [must, should, could]
  rules:
    - Implement one feature at a time; do not silently expand scope.
    - Use plan mode before any multi-file or architectural change.
    - Add or update tests/validation for every behavior change.
    - Keep ShellCheck clean and shfmt-formatted (2-space).
    - Never write secrets to deploy.log, process listings, or committed files.
    - Do not mark a feature done until its acceptance criteria pass.

features:
  - id: F-101
    title: Verify against a real gateway deployment
    priority: must
    status: done
    depends_on: []
    description: >
      Verified 2026-08-12 on a lab tenant, gateway 2.15.0. Registry login, digest-pinned pull,
      both containers healthy, /v1/health 200, MCP listener up on 8788, Redis connected in standalone
      mode, idempotent re-run exits early without restarting. The image ships wget (not curl), so the
      generated healthcheck is the wget variant and it works.
      Surfaced one real bug, now fixed: Redis could not start under cap_drop ALL (ADR-008).
      Also surfaced F-106: no way to mount a CA bundle, which blocks any host behind a TLS-
      inspecting proxy.
    implementation_notes:
      - "Correction: an unauthenticated request returning Error Code 03 does NOT prove control-plane
        sync. On the test host it meant the opposite - gateway logs showed
        fetchOrganisationIdFromAPIKey error: fetch failed, i.e. the control plane was never reached.
        Code 03 covers 'could not validate', not just 'key is invalid'."
      - Control-plane reachability was initially blocked by a TLS-inspecting VPN
        (SELF_SIGNED_CERT_IN_CHAIN, issuer CN=decrypt.paloaltonetworks.com). Retested with the VPN
        off - the container reaches the control plane, sync recovers on its own without a restart,
        and SCM reports connection_status healthy. See F-105 and F-106.
    acceptance:
      - docker compose ps shows gateway and redis healthy. PASS
      - curl localhost:8787/v1/health returns success. PASS
      - Re-running exits early; --force-pull re-pulls and restarts. PASS
      - Container reaches the control plane. PASS (VPN off)
      - An inference request appears in the SCM log view. PASS - see F-105.

  - id: F-105
    title: Confirm a successful inference lands in the SCM log view
    priority: must
    status: done
    depends_on: []
    description: >
      Fully verified 2026-08-12 with the VPN off. "@azure/claude-sonnet-5" returned a real completion
      through the local gateway ("GATEWAY OK", 32 tokens, provider azure-ai), and the request was
      pushed to the control plane (analyticsBatchInsertQueue completed). Zero fetch failures, and SCM
      reports the deployment connection_status healthy with a fresh last_synced_at.
      Two other slugs routed correctly but failed at the provider - vertex-ai "missing required
      authentication credential" and bedrock "security token invalid". Both are missing credentials
      in the SCM integrations, not installer faults; the routing itself proves config fetch worked.
      Likely the known Portkey migration gap where provider keys come back masked and are never
      re-entered.
    implementation_notes:
      - Config sync is pull-based with a 7-day cache, so integrations created before the deployment
        existed resolve fine on demand - the azure integration predates this deployment by two weeks.
        Corollary - edits in SCM may serve stale config until syncDataQueue picks up the
        invalidation; restart the container to force it.
    acceptance:
      - API key accepted and provider resolved from the slug. PASS
      - A 200 provider response with real completion content. PASS
      - Request pushed to the control plane (analyticsBatchInsertQueue). PASS
      - Deployment shows healthy in SCM with a recent last_synced_at. PASS

  - id: F-106
    title: Escape hatch for TLS-inspecting proxies
    priority: must
    status: done
    depends_on: []
    description: >
      A host behind a TLS-inspecting proxy gets SELF_SIGNED_CERT_IN_CHAIN and the gateway never
      reaches its control plane - the gateway is Node, which ignores the host trust store. Hit
      immediately on the first real test host, whose VPN re-signs traffic with
      CN=decrypt.paloaltonetworks.com.
      Shipped INSECURE_SKIP_TLS_VERIFY, which emits NODE_TLS_REJECT_UNAUTHORIZED=0, with a warning
      on every run and documented as lab-only. Verified 2026-08-12 - the variable reaches the
      container, inference still works with it on, and removing it restores verification.
    implementation_notes:
      - "Deliberately blunt: it disables peer verification on ALL outbound connections, LLM
        providers included. Documented as lab/POC only, with the production alternatives listed in
        docs/reference.md (exempt the FQDNs from decryption, move the host, or supply the CA)."
      - The setting only takes effect on a run that rewrites .env.runtime. An unchanged digest exits
        early, so --force-pull is needed after toggling it. Worth revisiting - see F-109.
    acceptance:
      - INSECURE_SKIP_TLS_VERIFY=true reaches the container as NODE_TLS_REJECT_UNAUTHORIZED=0. PASS
      - A warning is printed on every run while enabled. PASS
      - Unset by default; removing it restores verification. PASS

  - id: F-109
    title: Re-apply config changes when only .env changed
    priority: should
    status: todo
    depends_on: []
    description: >
      The early-exit path compares image digests, so a run where only .env changed exits without
      rewriting .env.runtime - the new setting silently does not apply. Found while testing F-106:
      INSECURE_SKIP_TLS_VERIFY=true appeared to do nothing until --force-pull was used.
      The installer already prints "If you changed .env, run ... --force-recreate", which puts the
      burden on the operator noticing.
    implementation_notes:
      - Hash the resolved runtime environment and store it next to .image-digest; re-deploy when
        either the digest or the config hash changes.
      - Do not let the hash file leak secrets - hash the content, never store it.
    acceptance:
      - Changing a value in .env and re-running applies it without --force-pull.
      - An unchanged .env and unchanged digest still exits early without restarting.

  - id: F-107
    title: Check SCM connection_status in --validate
    priority: should
    status: todo
    depends_on: []
    description: >
      --validate probes /v1/health locally, which proves the process listens but not that SCM
      considers the gateway connected. Those diverged during F-101 testing: health was green while
      the gateway could not reach the control plane at all.
      GET /ai_gw/admin/v2/deployments?organisation_id=<tsg> returns connection_status per deployment
      (healthy / unknown) plus last_synced_at. Verified live 2026-08-12 on the lab TSG with a
      service account, so it does not need a console session.
    implementation_notes:
      - Needs an SCM bearer token - OAuth2 client_credentials against
        auth.apps.paloaltonetworks.com/oauth2/access_token with scope tsg_id:<TSG>. The Red Teaming
        installer's api_authenticate is liftable.
      - Strictly opt-in (--check-scm or explicit credentials in .env) and never fatal. The route is
        outside the supported HTTP contract (ADR-002); the install path must not depend on it.
      - Match the local deployment by slug or name, and surface last_synced_at.
      - GET only. Never let this path issue a POST - see F-108.
    acceptance:
      - With credentials, --validate reports the SCM-side connection_status.
      - Without credentials, --validate behaves exactly as today.
      - A 403 or a schema change degrades to a warning, never a failed install.

  - id: F-108
    title: Register a gateway from client_id + client_secret (--register)
    priority: should
    status: todo
    depends_on: [F-107]
    description: >
      POST /ai_gw/admin/v2/deployments returns client_auth plus registry credentials, i.e. the whole
      values.yaml payload. Verified 2026-08-12 with the lab service account. This closes the gap
      with the Red Teaming installer, where the operator supplies only a client_id and secret.
      It stays opt-in and separate from install - see ADR-002 for why.
    implementation_notes:
      - "Request: POST /deployments {name, type: production|non_production, organisation_id: <tsg>,
        auth_settings: {allow_all_workspaces: bool}}."
      - "Response: {id, client_auth, credentials:{username,password}, organisation_id}. The
        username is the TSG ID; username, password and organisation_id are org-scoped and identical
        across deployments. client_auth is per-deployment and minted fresh on every POST."
      - CRITICAL - the POST is not idempotent and client_auth is never retrievable again. Never
        reach it as a fallback from the install path, never on a retry. Explicit verb only.
      - Check for an existing deployment of the same name first (GET) and refuse rather than
        silently creating a duplicate; require --force to proceed anyway.
      - Write the credentials straight to .env with the existing umask 077 + env_quote path, and
        print nothing but the deployment name and id.
      - Warn plainly that the route is unsanctioned and may break without notice.
    acceptance:
      - --register NAME creates a deployment and writes a working .env.
      - Re-running with the same name refuses instead of creating a duplicate.
      - No secret is printed to stdout or deploy.log.
      - Nothing on the default install path can trigger a POST.

  - id: F-102
    title: Guard the chart defaults against upstream drift
    priority: should
    status: todo
    depends_on: [F-101]
    description: >
      CHART_ENV_DEFAULTS mirrors airsgateway.builtinDefaults and the chart's environment.data. When
      upstream changes either, the installer silently produces a gateway that never syncs. This is
      the highest-consequence failure mode in the project and currently has no automated detection.
    implementation_notes:
      - A CI job that fetches _helpers.tpl and values.yaml from the pinned chart tag and diffs the
        default set against the script's constants would catch it.
      - Failing loudly on drift is better than auto-updating; the merge semantics need a human read.
      - Pin the chart version the installer claims to reproduce, and surface it in --script-version.
    acceptance:
      - CI fails when the upstream default set diverges from CHART_ENV_DEFAULTS.
      - The check names which variable drifted.

  - id: F-103
    title: Fail loudly when values.yaml has an unexpected shape
    priority: should
    status: todo
    depends_on: []
    description: >
      The awk fallback reader returns empty for anything it does not recognise, so callers apply
      defaults. That is right for optional keys but wrong for a restructured file: a gateway would
      be built from defaults plus two required keys, with the rest silently dropped.
    implementation_notes:
      - Sanity-check the file up front — imageCredentials present, environment.data non-empty.
      - Warn when values.yaml carries environment.data keys the installer does not pass through
        (i.e. absent from CORE_ENV_KEYS, CACHE_STORE_KEYS and LOG_STORE_KEYS), since that is the
        signal a new chart feature arrived.
    acceptance:
      - A values.yaml missing imageCredentials or environment.data fails with a clear message.
      - Unrecognised environment.data keys produce a warning naming them.

  - id: F-104
    title: Guard against .gitignore regression in CI
    priority: could
    status: todo
    depends_on: []
    description: >
      .gitignore protects the generated secrets (.env, .env.runtime, docker-compose.yml, deploy.log,
      values.yaml). A future change could start tracking them unnoticed.
    implementation_notes:
      - Assert with git check-ignore and git ls-files.
      - Keep the workflow SHA-pinned like the others.
    acceptance:
      - CI fails if any sensitive path becomes tracked or un-ignored.
      - The check runs on push and PR.
