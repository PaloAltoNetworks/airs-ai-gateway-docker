name: Lint

on:
  push:
    branches: [main, develop]
    paths:
      - "**.sh"
  pull_request:
    paths:
      - "**.sh"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0

  shfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shfmt
        run: docker run --rm -v "$PWD:/work" -w /work mvdan/shfmt:v3.13.1 -d -i 2 -ci setup-panw-ai-gateway.sh
